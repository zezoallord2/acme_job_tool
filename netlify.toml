[build]
  command = "npm run db:generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

# Secrets are configured in Netlify, never committed in this file.
# Database migrations run separately before a production release.

[[plugins]]
  package = "@netlify/plugin-nextjs"
