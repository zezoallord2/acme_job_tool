# Acme Jobs — MODE A: simple persistent server.
#
#   docker compose up --build
#
# Requires nothing paid. PostgreSQL runs alongside and files live on a named
# volume. AI is the default for every user and runs on the SERVER's keys: put a
# free GEMINI_API_KEY (and optionally OPENROUTER_API_KEY) in the `.env` file next
# to this compose file. Without a key, AI features say so clearly and offer
# Manual Mode; they never silently degrade.
#
# Keys are read from your shell or `.env` and passed through. Never paste a key
# into this file.
#
# S3 is NOT required for this mode.
#
# Before exposing this to the internet, replace every placeholder secret below
# (they are deliberately recognisable so a half-configured deploy fails loudly).

name: acme-jobs

x-app-env: &app-env
  NODE_ENV: production
  APP_URL: ${APP_URL:?set APP_URL to your public https origin}
  PORT: "3100"

  DATABASE_URL: postgresql://acme:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/acme_jobs?schema=public
  DIRECT_URL: postgresql://acme:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/acme_jobs?schema=public

  # 32+ random chars each. The server refuses to start if these are placeholders.
  AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
  KEY_ENCRYPTION_SECRET: ${KEY_ENCRYPTION_SECRET:?set KEY_ENCRYPTION_SECRET}

  ZERO_COST_MODE: "true"

  # --- AI (server keys, free tiers) ---------------------------------------
  # Chain: Gemini -> OpenRouter free model -> the user's own key (Settings).
  ACME_AI_ENABLED: ${ACME_AI_ENABLED:-true}
  DEFAULT_AI_PROVIDER: ${DEFAULT_AI_PROVIDER:-gemini}
  AI_MODE_PRIORITY: ${AI_MODE_PRIORITY:-gemini,openrouter}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  # Per-user daily caps for the AI-first features (abuse control, not a paywall).
  TAILOR_DAILY_CAP_FREE: ${TAILOR_DAILY_CAP_FREE:-5}
  TAILOR_DAILY_CAP_PAID: ${TAILOR_DAILY_CAP_PAID:-30}
  INTERVIEW_DAILY_CAP_FREE: ${INTERVIEW_DAILY_CAP_FREE:-3}
  INTERVIEW_DAILY_CAP_PAID: ${INTERVIEW_DAILY_CAP_PAID:-20}
  JOB_REFRESH_DAILY_CAP_FREE: ${JOB_REFRESH_DAILY_CAP_FREE:-10}
  JOB_REFRESH_DAILY_CAP_PAID: ${JOB_REFRESH_DAILY_CAP_PAID:-40}

  # --- Job search providers (each is a no-op, shown as "key missing", when unset)
  JOB_SEARCH_PROVIDERS: ${JOB_SEARCH_PROVIDERS:-}
  ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
  ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
  ADZUNA_COUNTRIES: ${ADZUNA_COUNTRIES:-us,gb}
  JOOBLE_API_KEY: ${JOOBLE_API_KEY:-}
  USAJOBS_API_KEY: ${USAJOBS_API_KEY:-}
  USAJOBS_USER_AGENT: ${USAJOBS_USER_AGENT:-}
  THEMUSE_API_KEY: ${THEMUSE_API_KEY:-}
  SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
  SERPAPI_MONTHLY_GLOBAL: ${SERPAPI_MONTHLY_GLOBAL:-240}
  SERPAPI_MONTHLY_PER_USER: ${SERPAPI_MONTHLY_PER_USER:-10}
  JSEARCH_API_KEY: ${JSEARCH_API_KEY:-}
  RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
  JSEARCH_MONTHLY_GLOBAL: ${JSEARCH_MONTHLY_GLOBAL:-90}
  JSEARCH_MONTHLY_PER_USER: ${JSEARCH_MONTHLY_PER_USER:-10}

  # MODE A: local files on a persistent volume. No S3 needed.
  STORAGE_DRIVER: local
  DATA_DIR: /app/data

  # Transactional mail. Use `development` to write to the local log instead.
  MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@example.com}
  MAIL_FROM_NAME: Acme Jobs

  BILLING_PROVIDER: ${BILLING_PROVIDER:-manual}
  BILLING_LINK_SECRET: ${BILLING_LINK_SECRET:-}

  # Automatic repair is refused outside a local environment.
  ALLOW_AUTO_REPAIR_IN_ENV: none
  RUN_WORKER_INLINE: "false"
  QUEUE_PROVIDER: postgres
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: acme_jobs
      # Deterministic collation keeps text ordering identical across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - acme-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme -d acme_jobs"]
      interval: 5s
      timeout: 5s
      # Long enough that a slow first boot on a cold volume does not look like a
      # failure and cause Compose to kill the migration step.
      retries: 30

  # Runs once per deploy, before anything serves traffic. Exits when done.
  migrate:
    build:
      context: .
    environment: *app-env
    # `prisma` is on PATH because the image installs the pinned CLI into
    # /opt/prisma-cli. `npx` is deliberately avoided: it tries to write to
    # $HOME/.npm, and the image runs as a user with no home directory.
    #
    # `prisma generate` is NOT run here: the client is generated during the image
    # build, and running it again in the runtime image fails because the pruned
    # standalone bundle does not ship the engine wasm the generator imports.
    command: >
      sh -c "prisma migrate deploy
      && node dist/scripts/production-check.js"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
    restart: unless-stopped
    environment: *app-env
    # Migrate first, then serve. Compose `depends_on` with a completed condition
    # guarantees the schema is current before the first request.
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3100}:3100"
    volumes:
      # MODE A requirement: a persistent volume, or uploads and exports vanish
      # on every deploy.
      - acme-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/api/health?strict=1').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      # Generous: a cold start after a deploy compiles nothing but does run the
      # readiness gate, which touches the database.
      retries: 5
      start_period: 40s

  worker:
    build:
      context: .
    restart: unless-stopped
    environment:
      <<: *app-env
      # The worker is its own process here, so the web process must not also
      # run background jobs.
      RUN_WORKER_INLINE: "false"
    command: ["node", "dist/worker/index.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      # Shares the data volume so the worker can read and delete uploads.
      - acme-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/api/health').then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  acme-pgdata:
  acme-data:
